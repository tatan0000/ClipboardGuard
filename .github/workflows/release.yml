name: Release - Sign & Publish

# 触发方式：
#   1. 推送 v* 版本标签（如 v1.0.0、v1.2.3-beta）
#   2. 手动触发，可选择是否发布为正式版
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本名称（如 1.0.0），留空则从 build.gradle 读取'
        required: false
        default: ''
      prerelease:
        description: '是否为预发布版本（Pre-release）'
        required: false
        type: boolean
        default: false
      draft:
        description: '是否保存为草稿（Draft），不立即公开'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # Release 不取消，避免重复签名

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  # ──────────────────────────────────────────────
  # Job: 构建签名 Release APK 并发布
  # ──────────────────────────────────────────────
  release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # 允许创建 Release 和上传资产

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── XposedBridgeAPI jar ──
      - name: Ensure XposedBridgeAPI jar exists
        run: |
          if [ ! -f "app/libs/XposedBridgeAPI-82.jar" ]; then
            echo "Downloading XposedBridgeAPI-82.jar..."
            mkdir -p app/libs
            curl -fsSL -o app/libs/XposedBridgeAPI-82.jar \
              "https://github.com/rovo89/XposedBridge/releases/download/art-v82/XposedBridgeApi-82.jar"
          fi

      # ── 读取版本信息 ──
      - name: Extract version info
        id: version
        run: |
          # 从标签或手动输入获取版本名
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          elif [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION="${{ github.event.inputs.version_name }}"
            TAG="v${VERSION}"
          else
            # 从 build.gradle 读取 versionName
            VERSION=$(grep 'versionName' app/build.gradle | sed 's/.*versionName "\(.*\)".*/\1/' | tr -d ' ')
            TAG="v${VERSION}-manual"
          fi
          VERSION_CODE=$(grep 'versionCode' app/build.gradle | sed 's/.*versionCode \([0-9]*\).*/\1/' | tr -d ' ')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "apk_name=ClipboardGuard-${VERSION}.apk" >> $GITHUB_OUTPUT
          echo "Resolved: version=${VERSION}, versionCode=${VERSION_CODE}, tag=${TAG}"

      # ── 解码签名密钥（从 GitHub Secrets 注入）──
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEY_STORE_BASE64}" ]; then
            echo "::warning::KEYSTORE_BASE64 secret not set. Building unsigned release APK."
            echo "SIGNING_AVAILABLE=false" >> $GITHUB_ENV
          else
            # 清理 Base64 字符串（去掉可能的换行和空格），然后用 printf 输出
            CLEAN_BASE64=$(echo "${KEY_STORE_BASE64}" | tr -d '[:space:]')
            printf '%s' "$CLEAN_BASE64" | base64 -d > keystore.jks
            # 验证密钥库是否有效
            if keytool -list -keystore keystore.jks -storepass "$KEY_STORE_PASSWORD" > /dev/null 2>&1; then
              echo "SIGNING_AVAILABLE=true" >> $GITHUB_ENV
              echo "Keystore decoded and verified successfully."
            else
              echo "::error::Keystore verification failed! Check KEYSTORE_BASE64 secret."
              echo "SIGNING_AVAILABLE=false" >> $GITHUB_ENV
              exit 1
            fi
          fi

      # ── 构建 Release APK（已签名）──
      - name: Build signed Release APK
        if: env.SIGNING_AVAILABLE == 'true'
        env:
          KEY_STORE_FILE: ${{ github.workspace }}/keystore.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="${KEY_STORE_FILE}" \
            -Pandroid.injected.signing.store.password="${KEY_STORE_PASSWORD}" \
            -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" \
            -Pandroid.injected.signing.key.password="${KEY_PASSWORD}" \
            --stacktrace

      # ── 构建 Debug APK（与 AS 本地行为一致，避免未签名问题）──
      - name: Build Debug APK (fallback when no signing config)
        if: env.SIGNING_AVAILABLE != 'true'
        run: ./gradlew assembleDebug --stacktrace

      # ── 重命名 APK ──
      - name: Rename APK
        id: rename_apk
        run: |
          APK_DIR="app/build/outputs/apk/release"
          ORIGINAL=$(ls ${APK_DIR}/*.apk 2>/dev/null | head -1)
          if [ -z "${ORIGINAL}" ]; then
            echo "::error::No APK found in ${APK_DIR}"
            exit 1
          fi
          TARGET="${APK_DIR}/${{ steps.version.outputs.apk_name }}"
          mv "${ORIGINAL}" "${TARGET}"
          echo "apk_path=${TARGET}" >> $GITHUB_OUTPUT
          echo "APK renamed to: ${TARGET}"
          ls -lh "${TARGET}"

      # ── 生成 SHA256 校验和 ──
      - name: Generate checksum
        run: |
          sha256sum "${{ steps.rename_apk.outputs.apk_path }}" > "${{ steps.rename_apk.outputs.apk_path }}.sha256"
          cat "${{ steps.rename_apk.outputs.apk_path }}.sha256"

      # ── 生成 Changelog（从 git log）──
      - name: Generate changelog
        id: changelog
        run: |
          # 获取上一个标签
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -n "${PREV_TAG}" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD" 2>/dev/null | head -50)
          else
            LOG=$(git log --pretty=format:"- %s (%h)" HEAD~20..HEAD 2>/dev/null | head -50)
          fi
          if [ -z "${LOG}" ]; then
            LOG="- 首次发布"
          fi
          # 写入多行输出
          {
            echo 'changelog<<EOF'
            echo "## 🚀 ClipboardGuard ${{ steps.version.outputs.version }}"
            echo ""
            echo "### 📋 更新内容"
            echo "${LOG}"
            echo ""
            echo "### 📦 安装说明"
            echo "1. 下载 \`${{ steps.version.outputs.apk_name }}\` 安装 APK"
            echo "2. 在 LSPosed 中激活模块，作用域勾选：**系统框架(android)** + **本模块**"
            echo "3. 重启设备生效"
            echo ""
            echo "### ✅ 要求"
            echo "- Android 11+ (API 30+)"
            echo "- LSPosed / EdXposed 框架"
            echo "- 悬浮窗权限（Settings → Apps → ClipboardGuard → 特殊权限）"
            echo ""
            echo "### 🔒 校验（SHA256）"
            echo "\`\`\`"
            cat "${{ steps.rename_apk.outputs.apk_path }}.sha256"
            echo "\`\`\`"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      # ── 上传构建产物（无论是否发布 Release）──
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.rename_apk.outputs.apk_path }}
            ${{ steps.rename_apk.outputs.apk_path }}.sha256
          retention-days: 30

      # ── 创建 GitHub Release ──
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "ClipboardGuard ${{ steps.version.outputs.version }}"
          body: ${{ steps.changelog.outputs.changelog }}
          draft: ${{ github.event.inputs.draft == 'true' || false }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'rc') }}
          files: |
            ${{ steps.rename_apk.outputs.apk_path }}
            ${{ steps.rename_apk.outputs.apk_path }}.sha256
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 清理敏感文件 ──
      - name: Clean up keystore
        if: always()
        run: rm -f keystore.jks
