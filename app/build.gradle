plugins {
    alias(libs.plugins.android.application)
}

// 读取签名配置（keystore.properties 不提交到 git）
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.android.clipboardguard'
    compileSdk 37

    defaultConfig {
        applicationId "com.android.clipboardguard"
        minSdk 30
        targetSdk 37
        versionCode 260613
        versionName "1.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            assets {
                srcDirs 'src\\main\\assets'
            }
        }
    }

    lint {
        // 忽略未导出的广播接收器警告（Xposed Hook 侧必需）
        disable 'UnspecifiedRegisterReceiverFlag'
        // 忽略所有 lint 警告以确保 CI 编译通过
        abortOnError false
        warningsAsErrors false
    }
    ndkVersion '29.0.14206865'
    buildToolsVersion '37.0.0'
    compileSdkMinor 0
}

dependencies {
    implementation libs.activity
    implementation libs.appcompat
    implementation libs.material
    implementation libs.swiperefreshlayout

    compileOnly libs.api
    compileOnly libs.libxposed.service
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
