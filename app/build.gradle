plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.android.clipboardguard'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.android.clipboardguard"
        minSdk 30
        targetSdk 37
        versionCode 260611
        versionName "1.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            assets {
                srcDirs 'src/main/assets'
            }
        }
    }

    lint {
        // 忽略未导出的广播接收器警告（Xposed Hook 侧必需）
        disable 'UnspecifiedRegisterReceiverFlag'
        // 忽略所有 lint 警告以确保 CI 编译通过
        abortOnError false
        warningsAsErrors false
    }
    buildToolsVersion '37.0.0'
    ndkVersion '29.0.14206865'
}

dependencies {
    implementation libs.activity
    implementation libs.appcompat
    implementation libs.material
    implementation libs.swiperefreshlayout

    compileOnly files('libs/XposedBridgeAPI-82.jar')
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
